<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATMAWEAPON</title>
    <!-- The style.css file allows you to change the look of your web pages.
         If you include the next line in all your web pages, they will all share the same look.
         This makes it easier to make new pages for your site. -->
    <link href="../style.css" rel="stylesheet" type="text/css" media="all">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
  </head>
  <body class="page">
    <div id="sat_puzzle_controls">
      <label for="sat_puzzle_variables">Variables:</label>
      <input type="number" id="n_mosaic_width" value="5" min="2" max="64">
      <label for="sat_puzzle_clauses">Clauses:</label>
      <input type="number" id="n_mosaic_height" value="10" min="2" max="64">
      <button id="sat_puzzle_regenerate" class="function">Generate()</button>
    </div>
    <div id="sat_puzzle_game" style="display: flex; gap: 4px;">
      <canvas id="sat_puzzle_board" width="576" height="863"></canvas>
    </div>
    <script src="sat_puzzle.js"></script>
  </body>
</html>
