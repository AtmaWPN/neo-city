<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATMAWEAPON</title>
    <link href="../style.css" rel="stylesheet" type="text/css" media="all">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
  </head>
  <body class="page">
    <h3>SAT Puzzle</h3>

    <p>A puzzle based on the Boolean satisfiability problem (SAT). Assign truth values to variables to satisfy all clauses.</p>

    <div id="sat_puzzle_controls">
      <label for="sat_puzzle_variables">Variables:</label>
      <input type="number" id="sat_puzzle_variables" value="4" min="2" max="12">
      <label for="sat_puzzle_clauses">Clauses:</label>
      <input type="number" id="sat_puzzle_clauses" value="5" min="2" max="12">
    </div>
    <canvas id="sat_puzzle_board" width="1024" height="576"></canvas>
    <div>
      <button id="sat_puzzle_regenerate" class="function">Regenerate()</button>
      <button id="sat_puzzle_check" class="function">Check()</button>
    </div>
    <script src="sat_puzzle.js"></script>
  </body>
</html>
