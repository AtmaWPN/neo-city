    <script>
      // Resize iframes to fit their content, padding heights to
      // a multiple of line-height so parent line numbers stay aligned.
      function measureContent(iframe) {
        var doc = iframe.contentDocument || iframe.contentWindow.document;
        return Math.max(
          doc.body.scrollHeight,
          doc.body.offsetHeight,
          doc.documentElement.offsetHeight
        );
      }

      function resizeIframe(iframe) {
        try {
          var doc = iframe.contentDocument || iframe.contentWindow.document;
          var lineH = getLineHeight(doc.body);

          // Find existing spacer
          var spacer = doc.querySelector('.iframe-spacer');
          var spacerH = spacer ? (parseInt(spacer.style.height, 10) || 0) : 0;

          // Total height includes current spacer; subtract to get clean content
          var total = measureContent(iframe);
          var contentH = total - spacerH;

          // Desired spacer height so total is a multiple of lineH
          var desiredSpacerH = (lineH - (contentH % lineH)) % lineH;
          var targetTotal = contentH + desiredSpacerH;

          var currentH = parseInt(iframe.style.height, 10) || 0;

          // If nothing changed, don't touch DOM (breaks observer feedback loop)
          if (currentH === targetTotal && spacerH === desiredSpacerH) return;

          if (desiredSpacerH > 0) {
            if (spacer) {
              spacer.style.height = desiredSpacerH + 'px';
            } else {
              spacer = doc.createElement('div');
              spacer.className = 'iframe-spacer';
              spacer.style.cssText = 'display:block;height:' + desiredSpacerH + 'px;line-height:0;';
              doc.body.appendChild(spacer);
            }
          } else {
            if (spacer) spacer.remove();
          }
          iframe.style.height = targetTotal + 'px';
        } catch(e) {
          iframe.style.height = '600px';
        }
      }

      function watchIframe(iframe) {
        if (iframe._watched) return;
        iframe._watched = true;
        var prev = 0;
        function poll() {
          var doc = iframe.contentDocument || iframe.contentWindow.document;
          if (doc && doc.body) {
            var h = Math.max(
              doc.body.scrollHeight,
              doc.body.offsetHeight,
              doc.documentElement.offsetHeight
            );
            if (h !== prev) {
              prev = h;
              resizeIframe(iframe);
            }
          }
          setTimeout(poll, 100);
        }
        setTimeout(poll, 100);
      }

      function resizeIframes() {
        document.querySelectorAll('.project-iframe').forEach(function(iframe) {
          var setup = function() {
            resizeIframe(iframe);
            watchIframe(iframe);
          };
          iframe.addEventListener('load', setup);
          if (iframe.contentDocument && iframe.contentDocument.readyState === 'complete') {
            setup();
          }
        });
      }

      window.addEventListener('resize', function() {
        document.querySelectorAll('.project-iframe').forEach(resizeIframe);
      });

      resizeIframes();
    </script>
